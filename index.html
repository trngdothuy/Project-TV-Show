<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Show Project | Trang Do Thuy (@trngdothuy)</title>
  <link href="style.css" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
</head>

<body>
  <h1>TV Show</h1>
  <p class="data-source">
    <i>data from <a href="http://TVMaze.com">TVMaze.com</a></i>
  </p>

  <div id="search-holder">

    <select name="shows" id="show-selector">
      <option value="default">Choose a Show</option>
    </select>

    <select name="films" id="film-selector">
      <option value="default">Choose an episode</option>
    </select>

    <label for="search">Search: </label>
    <input type="text" id="search" placeholder="Search keyword" />
    <label for="displayed-items" id="displayed-films-label"></label>
  </div>
  <main id="root">
    <div id="container"></div>
  </main>
  <script type="module" src="script.js"></script>
</body>

</html>
